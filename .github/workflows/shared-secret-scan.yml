name: Shared secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: shared-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    uses: rocjay1/engineering-control/.github/workflows/reusable-secret-scan.yml@603cfb5d85d157ac6204d79c12e59b1586bc9e7d
