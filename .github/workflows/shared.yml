# Managed by rocjay1/github-settings (workflows.py). Edit it there; changes here get overwritten.
name: Shared checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Copies of the shared checks in rocjay1/github-settings, which a public repo
# can't call while that repo is private. Each reports as "<job> / <job>".
jobs:
  secrets:
    name: secrets / secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  workflows:
    name: workflows / workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Lint workflows with actionlint
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_CONFIG: .github/zizmor.yml
        run: |
          set -euo pipefail
          args=()
          if [[ -f "${ZIZMOR_CONFIG}" ]]; then
            args=(--config "${ZIZMOR_CONFIG}")
          elif [[ "${ZIZMOR_CONFIG}" != ".github/zizmor.yml" ]]; then
            echo "::error::zizmor config ${ZIZMOR_CONFIG} not found"
            exit 1
          else
            echo "::notice::No ${ZIZMOR_CONFIG}; using the built-in zizmor config"
            default="${RUNNER_TEMP}/zizmor.yml"
            cat > "${default}" <<'YAML'
          rules:
            unpinned-uses:
              config:
                policies:
                  "*": hash-pin
                  # Immutable release tags; see the header of this workflow.
                  "rocjay1/github-settings/*": ref-pin
            # Lists rocjay1/github-settings' branches, which the caller's token can't
            # read while it's private. Everything else is hash-pinned.
            ref-confusion:
              disable: true
          YAML
            args=(--config "${default}")
          fi
          uvx "zizmor@${ZIZMOR_VERSION}" "${args[@]}" --format=github .
