# Managed by rocjay1/github-settings (workflows.py). Edit it there; changes here get overwritten.
name: Shared checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared checks from rocjay1/github-settings, each reporting as "<job> / <job>".
# Pinned to immutable release tags; Dependabot bumps them.
jobs:
  secrets:
    permissions:
      contents: read
      pull-requests: read
    uses: rocjay1/github-settings/.github/workflows/secret-scan.yml@v1.0.0

  workflows:
    permissions:
      contents: read
    uses: rocjay1/github-settings/.github/workflows/workflow-lint.yml@v1.0.0
