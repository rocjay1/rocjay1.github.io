name: Secret scan

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# Shared gitleaks scan from rocjay1/github-settings. Reports as "secrets / secrets".
jobs:
  secrets:
    permissions:
      contents: read
      pull-requests: read
    uses: rocjay1/github-settings/.github/workflows/secret-scan.yml@64b56bf3ea4286ae694ac6b2d8ed983b0c07f3f9 # reusable-workflows (rocjay1/github-settings#4)
