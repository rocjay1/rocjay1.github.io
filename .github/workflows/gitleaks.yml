name: Secret scan

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# Shared gitleaks scan from rocjay1/github-settings. Reports as "secrets / secrets".
# Pinned to an immutable release tag, so the tag can't move.
jobs:
  secrets:
    permissions:
      contents: read
      pull-requests: read
    uses: rocjay1/github-settings/.github/workflows/secret-scan.yml@v1.0.0
