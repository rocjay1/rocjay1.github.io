# Managed by rocjay1/github-settings (dependabot.py). Edit it there; changes here get overwritten.
version: 2

multi-ecosystem-groups:
  monthly:
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees: ["rocjay1"]
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    assignees: ["rocjay1"]
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
    cooldown:
      default-days: 7
